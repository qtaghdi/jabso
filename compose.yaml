services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jabso
      POSTGRES_USER: jabso
      POSTGRES_PASSWORD: jabso
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U jabso -d jabso']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - jabso-postgres:/var/lib/postgresql/data

volumes:
  jabso-postgres:
